<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Novara Dictionary</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b0f1a;
  color:white;
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

.card{
  width:800px;
  max-width:100%;
  background:#111827;
  padding:30px;
  border-radius:16px;
}

h1{ margin-top:0; }

input{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:none;
  margin-bottom:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #222;
  font-family:monospace;
  font-size:16px;
}
</style>
</head>

<body>
<div class="card">
<h1>Novara Dictionary</h1>
<input id="search" placeholder="Type English or Novara..." />

<div id="results"></div>
</div>

  {nov:"cende", en:"ignite / light"},

  // Adjectives

  {nov:"grand", en:"big / large"},
  {nov:"fort", en:"strong"},
  {nov:"pet", en:"small"},
  {nov:"rapid", en:"fast"},
  {nov:"nov", en:"new"},
  {nov:"ved", en:"old"},
  {nov:"clar", en:"clear"},
  {nov:"difis", en:"difficult / hard"},
  {nov:"enferm", en:"sick"},
  {nov:"pront", en:"ready"}

];
];

const input = document.getElementById("search");
const results = document.getElementById("results");

function normalize(str){
  return (str || "").toLowerCase().trim();
}

function render(list){
  results.innerHTML = "";
  list.forEach(entry=>{
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span>${entry.nov}</span><span>${entry.en}</span>`;
    results.appendChild(row);
  });
}

input.addEventListener("input", ()=>{
  const q = normalize(input.value);
  if(!q){
    results.innerHTML = "";
    return;
  }

  const matches = DICT.filter(entry =>
    normalize(entry.en).includes(q) ||
    normalize(entry.nov).includes(q)
  );

  render(matches);
});

</script>
