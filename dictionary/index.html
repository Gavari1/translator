<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Novara Dictionary</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b0f1a;
  color:white;
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

.card{
  width:800px;
  max-width:100%;
  background:#111827;
  padding:30px;
  border-radius:16px;
  box-sizing:border-box;
}

h1{ margin-top:0; }

input{
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:none;
  margin-bottom:14px;
  outline:none;
  box-sizing:border-box;
}

.azbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:0 0 16px 0;
  user-select:none;
}

.azbar a{
  font-family:monospace;
  font-size:14px;
  padding:6px 8px;
  border-radius:10px;
  background:#0f172a;
  color:#cbd5e1;
  text-decoration:none;
  border:1px solid #1f2a44;
}

.azbar a:hover{
  color:white;
  border-color:#334155;
}

.section{
  margin-top:18px;
}

.letter{
  font-family:monospace;
  font-weight:700;
  letter-spacing:.08em;
  opacity:.85;
  margin:18px 0 8px 0;
  padding-top:10px;
  border-top:1px solid #1f2a44;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:10px 0;
  border-bottom:1px solid #222;
  font-family:monospace;
  font-size:16px;
}

.row span:last-child{
  opacity:.9;
  text-align:right;
}

.empty{
  opacity:.7;
  font-family:monospace;
  padding:10px 0;
}

.note{
  font-size:13px;
  opacity:.7;
  margin:-6px 0 14px 0;
}

</style>
</head>

<body>
<div class="card">
  <h1>Novara Dictionary</h1>
  <input id="search" placeholder="Type English or Novara..." />
  <div class="note">Scroll A–Z or search to filter instantly.</div>

  <div class="azbar" id="azbar"></div>
  <div id="results"></div>
</div>

<script>
// SIMPLE DICTIONARY STRUCTURE

  // Pronouns

  // Possessives

  {nov:"eloa", en:"its"},
  {nov:"nosa", en:"our"},

  {nov:"vosa", en:"your (plural)"},

  // Core verbs
  {nov:"sere", en:"be"},

  {nov:"trove", en:"find"},
  {nov:"labre", en:"work"},

  {nov:"bibe", en:"drink"},
  {nov:"dorme", en:"sleep"},
  {nov:"lege", en:"read"},

  {nov:"baste", en:"build"},
  {nov:"grine", en:"smile"},
  {nov:"frise", en:"freeze"},

  {nov:"plene", en:"fill"},

  // Time words
  {nov:"ayar", en:"yesterday"},
  {nov:"doman", en:"tomorrow"},

  // Connectors & misc
  {nov:"i", en:"and"},
  {nov:"ma", en:"but"},
  {nov:"quan", en:"when"},
  {nov:"unde", en:"where"},
  {nov:"quia", en:"why"},
  {nov:"tote", en:"all"},

  {nov:"multa", en:"most"},

  // Adjectives
  {nov:"bon", en:"good"},
  {nov:"mal", en:"bad"},
  {nov:"grand", en:"big / large"},
  {nov:"fort", en:"strong"},
  {nov:"pet", en:"small"},
  {nov:"rapid", en:"fast"},
  {nov:"nov", en:"new"},
  {nov:"ved", en:"old"},
  {nov:"clar", en:"clear"},
  {nov:"difis", en:"difficult / hard"},
  {nov:"enferm", en:"sick"},
  {nov:"pront", en:"ready"}

const input   = document.getElementById("search");
const results = document.getElementById("results");
const azbar   = document.getElementById("azbar");

const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

function normalize(str){
  return (str || "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g," ");
}

function sortDict(list){
  // Sort by Novara, then English
  return [...list].sort((a,b)=>{
    const an = normalize(a.en);
    const bn = normalize(b.en);
    if(an < bn) return -1;
    if(an > bn) return 1;
    const ae = normalize(a.nov);
    const be = normalize(b.nov);
    if(ae < be) return -1;
    if(ae > be) return 1;
    return 0;
  });
}

function groupByLetter(list){
  const groups = {};
  LETTERS.forEach(L => groups[L] = []);

  list.forEach(entry=>{
    const key = (entry.en || "").trim().charAt(0).toUpperCase();
    const L = LETTERS.includes(key) ? key : "#";
    if(!groups[L]) groups[L] = [];
    groups[L].push(entry);
  });

  // Remove empty groups except keep A-Z (we’ll just skip empties in render)
  return groups;
}

function buildAZBar(){
  azbar.innerHTML = "";
  LETTERS.forEach(L=>{
    const a = document.createElement("a");
    a.href = `#sec-${L}`;
    a.textContent = L;
    azbar.appendChild(a);
  });
}

function renderGrouped(list){
  results.innerHTML = "";

  if(!list.length){
    results.innerHTML = `<div class="empty">No matches.</div>`;
    return;
  }

  const sorted = sortDict(list);
  const groups = groupByLetter(sorted);

  LETTERS.forEach(L=>{
    const entries = groups[L] || [];
    if(!entries.length) return;

    const section = document.createElement("div");
    section.className = "section";
    section.id = `sec-${L}`;

    const h = document.createElement("div");
    h.className = "letter";
    h.textContent = L;
    section.appendChild(h);

    entries.forEach(entry=>{
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span>${entry.en}</span><span>${entry.nov}</span>`;
      section.appendChild(row);
    });

    results.appendChild(section);
  });
}

function applySearch(){
  const q = normalize(input.value);

  // If empty search, show EVERYTHING A–Z
  if(!q){
    renderGrouped(DICT);
    return;
  }

  const matches = DICT.filter(entry =>
    normalize(entry.nov).includes(q) ||
    normalize(entry.en).includes(q)
  );

  renderGrouped(matches);
}

// Init
buildAZBar();
renderGrouped(DICT);

// Live search
input.addEventListener("input", applySearch);
</script>

</html>
