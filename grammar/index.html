<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En-i Translator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1b1b1b;
    color:white;
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:180px;
    font-size:18px;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    box-sizing:border-box;
    background:#2b2b2b;
    color:white;
    border:1px solid #555;
}

button{
    padding:12px 24px;
    font-size:18px;
    cursor:pointer;
    margin-right:10px;
}

#output{
    background:#111;
}
</style>
</head>

<body>

<h1>En-i Translator</h1>

<textarea id="input" placeholder="Type English here..."></textarea>

<button onclick="translateText()">Translate</button>
<button onclick="clearBoxes()">Clear</button>

<textarea id="output" placeholder="Translation..." readonly></textarea>

<script>

function isVowel(ch){
    return "aeiou".includes(ch);
}

function firstVowel(word){

    let lower = word.toLowerCase();

    // Does the word have a normal vowel?
    let hasRegularVowel = /[aeiou]/.test(lower);

    let start = 0;

    // qu always stays together
    if(lower.startsWith("qu")){
        start = 2;
    }

    for(let i=start;i<lower.length;i++){

        let c = lower[i];

        if(isVowel(c))
            return i;

        if(c==="y" && !hasRegularVowel)
            return i;
    }

    return -1;
}

function translateWord(word){

    if(word.length===0)
        return word;

    let punctuation="";

    while(word.length>0 &&
        /[^A-Za-z]/.test(word[word.length-1])){

        punctuation =
            word[word.length-1] + punctuation;

        word =
            word.slice(0,-1);
    }

    if(word==="")
        return punctuation;

    let capital =
        word[0]===word[0].toUpperCase();

    let lower =
        word.toLowerCase();

    let v =
        firstVowel(lower);

    let result;

    // vowel-starting words
    if(v===0){

        result =
            "en"+lower+"i";

    }

    // no vowels at all
    else if(v===-1){

        result =
            "en"+lower+"i";

    }

    else{

        let cluster =
            lower.substring(0,v);

        let rest =
            lower.substring(v);

        result =
            cluster+"en"+rest+"i";

    }

    if(capital){

        result =
            result.charAt(0).toUpperCase()+
            result.slice(1);

    }

    return result+punctuation;
}

function translateText(){

    let text =
        document.getElementById("input").value;

    let words =
        text.split(/(\s+)/);

    let output =
        "";

    for(let part of words){

        if(part.trim()===""){

            output += part;

        }
        else{

            output +=
                translateWord(part);

        }

    }

    document.getElementById("output").value =
        output;

}

function clearBoxes(){

    document.getElementById("input").value="";
    document.getElementById("output").value="";

}

</script>

</body>
</html>
