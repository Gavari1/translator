<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pig Latin Translator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #1b1b1b;
    color: white;
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 180px;
    font-size: 18px;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 20px;
    box-sizing: border-box;
    background: #2b2b2b;
    color: white;
    border: 1px solid #555;
}

button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    margin-right: 10px;
}

#output {
    background: #111;
}
</style>
</head>

<body>

<h1>Pig Latin Translator</h1>

<textarea
    id="input"
    placeholder="Type English here..."
></textarea>

<button onclick="translateText()">Translate</button>
<button onclick="clearBoxes()">Clear</button>

<textarea
    id="output"
    placeholder="Translation..."
    readonly
></textarea>

<script>

function isRegularVowel(letter) {
    return "aeiou".includes(letter);
}

function findFirstVowel(word) {
    const lower = word.toLowerCase();

    const lettersOnly = lower.replace(/['’]/g, "");
    const hasRegularVowel = /[aeiou]/.test(lettersOnly);

    let i = 0;

    while (i < lower.length) {
        const letter = lower[i];

        // Keep QU together in the opening cluster.
        if (
            letter === "q" &&
            lower[i + 1] === "u"
        ) {
            i += 2;
            continue;
        }

        if (isRegularVowel(letter)) {
            return i;
        }

        // Y is a vowel only if the word contains no A, E, I, O, or U.
        if (letter === "y" && !hasRegularVowel) {
            return i;
        }

        i++;
    }

    return -1;
}

function applyCapitalization(original, translated) {
    const firstLetterWasCapital =
        original[0] === original[0].toUpperCase();

    translated = translated.toLowerCase();

    if (firstLetterWasCapital) {
        return (
            translated.charAt(0).toUpperCase() +
            translated.slice(1)
        );
    }

    return translated;
}

function translateWord(word) {
    if (!word) {
        return word;
    }

    const match = word.match(
        /^([^A-Za-z]*)([A-Za-z][A-Za-z'’]*)([^A-Za-z]*)$/
    );

    if (!match) {
        return word;
    }

    const beginningPunctuation = match[1];
    const originalWord = match[2];
    const endingPunctuation = match[3];

    const lower = originalWord.toLowerCase();
    const firstVowel = findFirstVowel(lower);

    let translated;

    // Vowel-starting words receive -yay.
    if (firstVowel === 0) {
        translated = lower + "yay";
    }

    // Words with no recognizable vowel receive -ā.
    else if (firstVowel === -1) {
        translated = lower + "ā";
    }

    // Move the complete opening consonant cluster,
    // then add -ā.
    else {
        const cluster = lower.slice(0, firstVowel);
        const rest = lower.slice(firstVowel);

        translated = rest + cluster + "ā";
    }

    translated = applyCapitalization(
        originalWord,
        translated
    );

    return (
        beginningPunctuation +
        translated +
        endingPunctuation
    );
}

function translateText() {
    const text =
        document.getElementById("input").value;

    const parts = text.split(/(\s+)/);

    const translation = parts
        .map(part => {
            if (part.trim() === "") {
                return part;
            }

            return translateWord(part);
        })
        .join("");

    document.getElementById("output").value =
        translation;
}

function clearBoxes() {
    document.getElementById("input").value = "";
    document.getElementById("output").value = "";
}

</script>

</body>
</html>
