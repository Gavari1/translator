<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roman Grid Cipher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 760px;
    }

    h1 {
      margin-bottom: 6px;
      text-align: center;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 28px;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;

      background: #0d0d0d;
      color: white;

      border: 1px solid #444;
      border-radius: 12px;

      padding: 15px;
      font-size: 18px;
      line-height: 1.5;

      outline: none;
    }

    textarea:focus {
      border-color: #888;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      flex: 1;

      border: none;
      border-radius: 10px;

      padding: 13px 16px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .translate {
      background: white;
      color: black;
    }

    .clear {
      background: #333;
      color: white;
    }

    .output-title {
      margin-bottom: 14px;
      font-weight: bold;
    }

    #output {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .word-row {
      background: #0d0d0d;
      border: 1px solid #333;

      border-radius: 10px;
      padding: 13px 15px;

      font-family: "Courier New", monospace;
      font-size: 17px;

      overflow-x: auto;
      white-space: nowrap;
    }

    .empty {
      color: #777;
      font-style: italic;
    }

    .grid-card {
      text-align: center;
    }

    .grid {
      display: inline-grid;
      grid-template-columns: 45px repeat(4, 55px);
      gap: 6px;

      margin-top: 10px;
      font-family: "Courier New", monospace;
    }

    .grid div {
      padding: 8px 4px;
      border-radius: 6px;
      background: #252525;
    }

    .grid .number {
      color: #999;
    }

    .grid .blank {
      background: transparent;
    }

    .example {
      margin-top: 18px;
      color: #aaa;
      line-height: 1.7;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      h1 {
        font-size: 26px;
      }

      .card {
        padding: 16px;
      }

      .word-row {
        font-size: 15px;
      }

      .grid {
        grid-template-columns: 35px repeat(4, 45px);
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Roman Grid Cipher</h1>

    <div class="subtitle">
      BARK • DOVE • FISH • JUMP • LYNX
    </div>


    <!-- INPUT -->
    <div class="card">

      <label for="input">
        Enter English
      </label>

      <textarea
        id="input"
        placeholder="Example: You are dumb"
      ></textarea>

      <div class="buttons">

        <button
          class="translate"
          onclick="translateText()"
        >
          Translate
        </button>

        <button
          class="clear"
          onclick="clearAll()"
        >
          Clear
        </button>

      </div>

    </div>


    <!-- OUTPUT -->
    <div class="card">

      <div class="output-title">
        Cipher
      </div>

      <div id="output">
        <div class="empty">
          Your translation will appear here.
        </div>
      </div>

    </div>


    <!-- GRID -->
    <div class="card grid-card">

      <strong>Cipher Grid</strong>

      <div class="grid">

        <div class="blank"></div>
        <div>I</div>
        <div>II</div>
        <div>III</div>
        <div>IV</div>

        <div class="number">I</div>
        <div>B</div>
        <div>A</div>
        <div>R</div>
        <div>K</div>

        <div class="number">II</div>
        <div>D</div>
        <div>O</div>
        <div>V</div>
        <div>E</div>

        <div class="number">III</div>
        <div>F</div>
        <div>I</div>
        <div>S</div>
        <div>H</div>

        <div class="number">IV</div>
        <div>J</div>
        <div>U</div>
        <div>M</div>
        <div>P</div>

        <div class="number">V</div>
        <div>L</div>
        <div>Y</div>
        <div>N</div>
        <div>X</div>

        <div class="number">VI</div>
        <div>C</div>
        <div>G</div>
        <div>Q</div>
        <div>T</div>

        <div class="number">VII</div>
        <div>W</div>
        <div>Z</div>
        <div>—</div>
        <div>—</div>

      </div>

      <div class="example">
        <strong>Example:</strong><br>
        YOU → V.II^II.II^IV.II<br>
        ARE → I.II^I.III^II.IV<br>
        DUMB → II.I^IV.II^IV.III^I.I
      </div>

    </div>

  </div>


  <script>

    /*
      GRID

      1  B A R K
      2  D O V E
      3  F I S H
      4  J U M P
      5  L Y N X
      6  C G Q T
      7  W Z

      Coordinates are:
      ROW.COLUMN

      Both are written as Roman numerals.
    */

    const grid = [
      ["B", "A", "R", "K"],
      ["D", "O", "V", "E"],
      ["F", "I", "S", "H"],
      ["J", "U", "M", "P"],
      ["L", "Y", "N", "X"],
      ["C", "G", "Q", "T"],
      ["W", "Z"]
    ];


    const roman = {
      1: "I",
      2: "II",
      3: "III",
      4: "IV",
      5: "V",
      6: "VI",
      7: "VII"
    };


    /*
      Build the letter → coordinate map automatically.
    */

    const cipher = {};

    grid.forEach((row, rowIndex) => {

      row.forEach((letter, columnIndex) => {

        const rowNumber = rowIndex + 1;
        const columnNumber = columnIndex + 1;

        cipher[letter] =
          roman[rowNumber] +
          "." +
          roman[columnNumber];

      });

    });


    function encodeWord(word) {

      const encodedLetters = [];

      for (const character of word.toUpperCase()) {

        if (cipher[character]) {

          encodedLetters.push(cipher[character]);

        }

      }

      return encodedLetters.join("^");

    }


    function translateText() {

      const input =
        document
          .getElementById("input")
          .value
          .trim();

      const output =
        document.getElementById("output");

      output.innerHTML = "";


      if (!input) {

        output.innerHTML =
          '<div class="empty">' +
          'Enter something above.' +
          '</div>';

        return;

      }


      /*
        Split input into words.

        Every word becomes its OWN row.
      */

      const words =
        input.match(/[A-Za-z]+/g) || [];


      words.forEach(word => {

        const row =
          document.createElement("div");

        row.className = "word-row";

        row.textContent =
          encodeWord(word);

        output.appendChild(row);

      });

    }


    function clearAll() {

      document
        .getElementById("input")
        .value = "";

      document
        .getElementById("output")
        .innerHTML =
          '<div class="empty">' +
          'Your translation will appear here.' +
          '</div>';

    }


    /*
      Translate live while typing.
    */

    document
      .getElementById("input")
      .addEventListener(
        "input",
        translateText
      );

  </script>

</body>
</html>
