<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>English to Elefen Translator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="device" role="application" aria-label="English to Elefen Translator">
    <div class="topbar">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        ENGLISH → ELEFEN TRANSLATOR
      </div>
      <div class="model">MODEL: LFN-03 • VOCAB + RULES SPLIT</div>
    </div>

    <div class="screen-wrap">
      <div class="screen">
        <div class="row">
          <div class="label"></div>
        </div>

        <div class="split">
          <div>
            <div class="label" style="margin:0 0 6px;">INPUT / ENGLISH</div>
            <textarea id="inText" placeholder="Type English here...">I think that if you had a blue car, I would be happy.</textarea>
          </div>

          <div>
            <div class="label" style="margin:0 0 6px;">OUTPUT / ELEFEN</div>
            <textarea id="outText" readonly placeholder="Elefen appears here..."></textarea>
          </div>
        </div>

        <div class="controls">
          <div class="btns">
            <button class="btn-blue" id="btnTranslate">TRANSLATE</button>
            <button class="btn-yellow" id="btnCopy">COPY OUTPUT</button>
            <button class="btn-red" id="btnClear">CLEAR</button>
          </div>
        </div>
      </div>
    </div>

    <div class="foot"></div>
  </div>

  <!-- Load order matters: vocab first, rules second, engine last. -->
  <script src="vocab.js"></script>
  <script src="rules.js"></script>
  <script src="translator.js"></script>
</body>
</html>
