<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="description"
    content="A simple English to Elefen translation tool."
  />

  <title>Elefen Translator</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app">
    <header class="app-header">
      <h1>Elefen Translator</h1>
    </header>

    <section class="translator" aria-label="Elefen Translator">
      <div class="translation-grid">
        <div class="field">
          <div class="field-header">
            <label for="inText">English</label>
            <span>Input</span>
          </div>

          <textarea
            id="inText"
            placeholder="Enter English text..."
            spellcheck="true"
          >I think that if you had a blue car, I would be happy.</textarea>
        </div>

        <div class="field">
          <div class="field-header">
            <label for="outText">Elefen</label>
            <span>Translation</span>
          </div>

          <textarea
            id="outText"
            readonly
            placeholder="Your Elefen translation will appear here..."
            aria-live="polite"
          ></textarea>
        </div>
      </div>

      <div class="controls">
        <button
          type="button"
          class="button button-primary"
          id="btnTranslate"
        >
          Translate
        </button>

        <button
          type="button"
          class="button button-secondary"
          id="btnCopy"
        >
          Copy Output
        </button>

        <button
          type="button"
          class="button button-quiet"
          id="btnClear"
        >
          Clear
        </button>
      </div>
    </section>
  </main>

  <!-- Load order matters: vocabulary, rules, then translator engine. -->
  <script src="vocab.js"></script>
  <script src="rules.js"></script>
  <script src="translator.js"></script>
</body>
</html>
